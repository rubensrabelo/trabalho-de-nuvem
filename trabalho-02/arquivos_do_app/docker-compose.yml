services:
  nginx:
    image: nginx:alpine
    container_name: proxy_nginx
    ports:
      - "80:80"
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app1
      - app2
    networks:
      - devops

  app1:
    image: showip:latest
    container_name: python_app1
    networks:
      - devops

  app2:
    image: showip:latest
    container_name: python_app2
    networks:
      - devops

networks:
  devops:
    driver: bridge
